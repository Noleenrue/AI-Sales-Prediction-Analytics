{% extends "base.html" %}

{% block content %}

<div class="product-form-page">

    <div class="product-form-card">

        {% if mode == "edit" %}
            <h1>Edit Product</h1>
        {% else %}
            <h1>Add Product</h1>
        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label>Product ID</label>

                <input
                    type="text"
                    name="product_id"
                    value="{{
                        product.ProductID
                        if product else ''
                    }}"
                    {% if mode == "edit" %}
                        readonly
                    {% endif %}
                    required
                >

            </div>

            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    name="product_name"
                    value="{{
                        product.ProductName
                        if product else ''
                    }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Subcategory</label>

                <select
                    name="subcategory_id"
                    required
                >

                    <option value="">
                        Select Subcategory
                    </option>

                    {% for subcategory in subcategories %}

                    <option
                        value="{{ subcategory.SubCategoryID }}"

                        {% if
                            product
                            and
                            product.SubCategoryID
                            ==
                            subcategory.SubCategoryID
                        %}
                            selected
                        {% endif %}
                    >
                        {{ subcategory.SubCategoryName }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="save-button"
                >
                    {% if mode == "edit" %}
                        Update Product
                    {% else %}
                        Save Product
                    {% endif %}
                </button>

                <a
                    href="{{ url_for('products.products_page') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
